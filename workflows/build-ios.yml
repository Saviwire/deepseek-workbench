name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch: # This lets you run it manually

jobs:
  build-ios:
    runs-on: macos-latest # This requests a free Mac cloud runner

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Build iOS (Unsigned)
      run: flutter build ios --release --no-codesign

    - name: Package into IPA
      run: |
        mkdir -p Payload
        mv build/ios/iphoneos/Runner.app Payload/
        zip -r deepseek-workbench.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: deepseek-workbench.ipa
